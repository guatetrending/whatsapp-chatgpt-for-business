<!doctype html>
<html>
	<head>
		<meta charset="UTF-8" />
		<title>WhatsApp CRM</title>
		<style>
			body {
				font-family: Arial, sans-serif;
				width: 300px;
				padding: 10px;
			}
			input,
			textarea {
				width: 100%;
				margin: 4px 0;
			}
			button {
				margin-top: 6px;
			}
		</style>
	</head>
	<body>
		<h3>Contacts</h3>
		<div id="contacts"></div>

		<h3>Add Contact</h3>
		<input id="name" placeholder="Name" />
		<input id="number" placeholder="Phone number" />
		<textarea id="template" placeholder="Message template"></textarea>
		<button id="addBtn">Add</button>

		<script src="popup.js"></script>
	</body>
</html>
